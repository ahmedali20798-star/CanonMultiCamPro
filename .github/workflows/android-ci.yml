name: Verify & Build CanonMultiCam Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt Strict Static Analysis
        run: ./gradlew detekt --stacktrace

      - name: Run Deterministic Protocol & Temporal Proof Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Verified Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Verified APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanonMultiCamPro-V13-Verified-APK
          path: app/build/outputs/apk/debug/*.apk
